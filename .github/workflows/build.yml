name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore PD2Cloud.slnx
      - name: Build
        run: dotnet build PD2Cloud.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test PD2Cloud.slnx --configuration Release --no-build
      - name: Check formatting
        run: dotnet format PD2Cloud.slnx --verify-no-changes --no-restore
