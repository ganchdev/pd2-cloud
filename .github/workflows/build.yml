name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore PD2Cloud.slnx
      - name: Build
        run: dotnet build PD2Cloud.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test PD2Cloud.slnx --configuration Release --no-build
      - name: Check formatting
        run: dotnet format PD2Cloud.slnx --verify-no-changes --no-restore

  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: pd2-cloud-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            archive: pd2-cloud-linux-x64.tar.gz
          - os: macos-latest
            rid: osx-arm64
            archive: pd2-cloud-osx-arm64.dmg
          - os: macos-latest
            rid: osx-x64
            archive: pd2-cloud-osx-x64.dmg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # NuGet's Version property requires a valid SemVer string, so the leading
      # "v" from release tags must be stripped. "v1.0.0" makes restore fail with
      # an opaque MSB4181 before any useful diagnostic is produced.
      - name: Resolve version
        id: version
        shell: bash
        env:
          RAW_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}
        run: echo "value=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          # Public metadata, supplied as a repository variable so released builds
          # work without environment configuration on the target machine.
          DEFAULT_GITHUB_CLIENT_ID: ${{ vars.PD2CLOUD_GITHUB_CLIENT_ID }}
        run: >-
          dotnet publish src/PD2Cloud.Desktop/PD2Cloud.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=none
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.value }}
          -p:DefaultGitHubClientId=${{ env.DEFAULT_GITHUB_CLIENT_ID }}
          --output publish/${{ matrix.rid }}

      # macOS: wrap the bare executable in a .app bundle so Finder treats it as
      # an application, then package that bundle into a .dmg.
      - name: Free disk space (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          # The Xcode toolchains and preinstalled caches are irrelevant to a
          # .NET build, and a 280 MB .app plus hdiutil scratch space does not
          # fit on the default macOS runner image otherwise.
          sudo rm -rf /Applications/Xcode_*.app 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches 2>/dev/null || true
          sudo rm -rf /Library/Developer/CoreSimulator/Caches 2>/dev/null || true
          dotnet nuget locals all --clear || true
          df -h /
      - name: Bundle .app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          APP="build/PD2Cloud.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          # Move rather than copy: the publish output is not needed afterwards,
          # and duplicating a ~105 MB binary risks exhausting runner disk.
          mv "publish/${{ matrix.rid }}/PD2Cloud.Desktop" "$APP/Contents/MacOS/PD2Cloud"
          chmod +x "$APP/Contents/MacOS/PD2Cloud"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>PD2 Cloud</string>
            <key>CFBundleDisplayName</key>
            <string>PD2 Cloud</string>
            <key>CFBundleIdentifier</key>
            <string>com.ganchdev.pd2cloud</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>PD2Cloud</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.utilities</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -f '${{ matrix.archive }}'
          # hdiutil create -srcfolder stages through a temporary mount and fails
          # with a misleading "No space left on device" for the x64 self-contained
          # bundle even with >90 GB free, while the arm64 bundle succeeds. Build a
          # correctly sized read/write image, copy the bundle in, then compress.
          rm -rf 'publish/${{ matrix.rid }}'
          app_mb=$(du -sm 'build/PD2Cloud.app' | cut -f1)
          image_mb=$((app_mb + 200))
          rm -f 'build/staging.dmg'
          hdiutil create -size "${image_mb}m" -fs HFS+ -volname 'PD2Cloud' 'build/staging.dmg'
          mount_point=$(hdiutil attach 'build/staging.dmg' -nobrowse | tail -1 | sed 's/.*\/Volumes/\/Volumes/')
          cp -R 'build/PD2Cloud.app' "$mount_point/"
          sync
          hdiutil detach "$mount_point"
          hdiutil convert 'build/staging.dmg' -format UDZO -o '${{ matrix.archive }}'
          hdiutil verify '${{ matrix.archive }}'
          df -h /

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Native SkiaSharp/HarfBuzz packages ship .pdb files that
          # DebugType=none does not remove; keep the zip to the executable.
          Get-ChildItem 'publish/${{ matrix.rid }}' -Filter *.pdb -ErrorAction SilentlyContinue | Remove-Item -Force
          Compress-Archive -Path 'publish/${{ matrix.rid }}/*' -DestinationPath '${{ matrix.archive }}'
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf '${{ matrix.archive }}' -C 'publish/${{ matrix.rid }}' .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
