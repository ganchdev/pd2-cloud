[tools]
dotnet = "10.0.401"

[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"
# Keep Avalonia's build-time telemetry from writing outside the workspace.
AVALONIA_TELEMETRY_OPTOUT = "1"

[tasks.restore]
description = "Restore application dependencies"
run = "dotnet restore PD2Cloud.slnx"

[tasks.build]
description = "Build the desktop application"
run = "dotnet build PD2Cloud.slnx --configuration Release"

[tasks.run]
description = "Open PD2 Cloud folder inspection"
run = "dotnet run --project src/PD2Cloud.Desktop/PD2Cloud.Desktop.csproj"

[tasks.format]
description = "Format C# source"
run = "dotnet format PD2Cloud.slnx"

[tasks."format:check"]
description = "Check C# formatting without changing files"
run = "dotnet format PD2Cloud.slnx --verify-no-changes"

[tasks.test]
description = "Run behavior tests"
run = "dotnet test PD2Cloud.slnx --configuration Release"
